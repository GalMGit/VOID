<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;background:#f3f4f6;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;border:1px solid #e5e7eb;padding:40px;">

                <tr>
                    <td align="center">
                        <h2 style="margin:0;color:#4CAF50;">
                            Добро пожаловать, {{Email}}!
                        </h2>
                    </td>
                </tr>

                <tr>
                    <td style="padding-top:30px;">
                        <p style="font-size:16px;color:#333;">
                            Ваш код подтверждения смены пароля:
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding:25px 0;">

                        <div style="
                            display:inline-block;
                            padding:18px 40px;
                            background:#f5f5f5;
                            border-radius:8px;
                            font-size:34px;
                            font-weight:bold;
                            letter-spacing:8px;
                            color:#222;">
                            {{Code}}
                        </div>

                    </td>
                </tr>

                <tr>
                    <td>
                        <p style="font-size:15px;color:#555;">
                            Код действителен
                            <strong>5 минут</strong>.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding-top:25px;">
                        <hr style="border:none;border-top:1px solid #e5e7eb;">
                    </td>
                </tr>

                <tr>
                    <td style="padding-top:20px;">
                        <p style="font-size:12px;color:#777;line-height:1.6;">
                            Если вы не запрашивали смену пароля в
                            <strong>VOID Messenger</strong>,
                            просто проигнорируйте это письмо.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
